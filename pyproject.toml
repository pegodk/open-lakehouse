[project]
name = "open-lakehouse"
version = "0.1.0"
description = "Open-source data lakehouse built on PySpark, Delta Lake, and Unity Catalog"
requires-python = ">=3.11"
dependencies = [
    "pyspark>=3.5,<4.0",
    "delta-spark>=3.2,<4.0",
    "dagster>=1.7,<2.0",
    "dagster-webserver>=1.7,<2.0",
    "python-dotenv>=1.0",
    "duckdb>=1.1",
    "deltalake>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "chispa>=0.10",
    "ruff>=0.4",
    "mypy>=1.10",
]
notebooks = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lakehouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring Docker services (deselect with '-m \"not integration\"')",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.dagster]
module_name = "lakehouse.definitions"
