services:
  unity-catalog:
    image: unitycatalog/unitycatalog:main
    networks:
      default:
        aliases:
          - server
    ports:
      - "8080:8080"
    environment:
      - UC_STORAGE_ROOT=s3a://lakehouse/
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_REGION=us-east-1
      - S3_ENDPOINT=http://minio:9000
    depends_on:
      minio:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/lakehouse --ignore-existing;
      exit 0;
      "

  spark-master:
    image: apache/spark:3.5.4
    command: /opt/spark/sbin/start-master.sh --host 0.0.0.0
    ports:
      - "7077:7077"
      - "8081:8080"
    environment:
      SPARK_NO_DAEMONIZE: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  spark-worker:
    image: apache/spark:3.5.4
    command: /opt/spark/sbin/start-worker.sh spark://spark-master:7077
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CORES: "2"

  unity-catalog-ui:
    image: unitycatalog/unitycatalog-ui:main
    ports:
      - "3000:3000"
    environment:
      - PROXY=http://unity-catalog:8080
    depends_on:
      - unity-catalog

volumes:
  minio-data:
